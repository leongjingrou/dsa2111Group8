[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa2111-group8-telemedicine"
version = "0.1.0"
description = "Prototype knowledge-base and explainable diagnostic model components"
requires-python = ">=3.13,<3.14"
dependencies = [
  "interpret-core>=0.7.8,<0.8",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["knowledge_base", "diagnostic_model/tests"]
addopts = "-q -p no:cacheprovider"
