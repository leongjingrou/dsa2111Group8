apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnosis-api
  namespace: diagnosis-sim
spec:
  replicas: 2
  template:
    spec:
      securityContext:
        fsGroup: 10001
      volumes:
        - name: consultation-state
          persistentVolumeClaim:
            claimName: consultation-state
      containers:
        - name: api
          volumeMounts:
            - name: consultation-state
              mountPath: /app/runtime
          image: diagnosis-api:llm-orchestrated
          command: ["uvicorn"]
          args: ["llm_service.orchestrated_main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
          env:
            - name: MODEL_BACKEND
              value: ebm
            - name: EBM_LIVE_MODEL
              value: /models/ebm_sequential_models.joblib
            - name: STOPPING_MODEL
              value: /models/ebm_stopping_controller.joblib
            - name: LLM_BACKEND
              value: keyword
            - name: MAX_ACTIVE_SESSIONS
              value: "4096"
            - name: CONSULTATION_DB
              value: /app/runtime/consultations.sqlite3
