apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          image: diagnosis-api:llm-orchestrated
          args:
            - -f
            - /app/serving/llm_locustfile.py
            - --worker
            - --master-host
            - locust-master
