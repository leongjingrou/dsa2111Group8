apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: diagnosis-api
  namespace: diagnosis-sim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: diagnosis-api
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
