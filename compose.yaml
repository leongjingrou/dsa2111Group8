services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      MODEL_BACKEND: ebm
      EBM_LIVE_MODEL: /models/ebm_sequential_models.joblib
      STOPPING_MODEL: /models/ebm_stopping_controller.joblib
      CONSULTATION_DB: /app/runtime/consultations.sqlite3
    volumes:
      - ./runtime/models:/models:ro
      - consultation-state:/app/runtime
    deploy:
      replicas: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  consultation-state:
