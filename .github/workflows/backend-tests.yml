name: Backend safety and end-to-end tests

on:
  pull_request:
  push:
    branches: [main, safety-integration, "codex/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/dsa2111-matplotlib
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test,serve,speech]"
      - run: python -m pytest --junitxml=runtime/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: runtime/test-results.xml
